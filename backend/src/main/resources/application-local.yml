spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project}
    username: ${DB_USERNAME:project}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

auth:
  google:
    allowed-audiences:
      - ${GOOGLE_CLIENT_ID}

  jwt:
    issuer: a508-backend
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d