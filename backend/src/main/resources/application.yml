spring:
  application:
    name: backend

  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

fcm:
  enabled: ${FCM_ENABLED:false}

gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  api-key: ${GMS_KEY:}
  model: ${GMS_MODEL:gpt-5.4-mini}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
